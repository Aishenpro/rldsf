# Run from the project root:  docker compose -f docker/docker-compose.yml up -d --build
services:
  web:
    build: { context: .., dockerfile: docker/Dockerfile }
    env_file: ../.env
    environment:
      DB_FILE: /app/database/data/foundation.sqlite
    ports: ["3000:3000"]
    volumes:
      - db-data:/app/database/data
      - uploads:/app/uploads
    restart: unless-stopped
volumes:
  db-data:
  uploads:
