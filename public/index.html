<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Under Maintenance</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;color:white;background:linear-gradient(135deg,#ff0080,#7928ca,#007cf0,#00dfd8,#00ff87);background-size:400% 400%;animation:bg 12s infinite}@keyframes bg{50%{background-position:100% 50%}}.box{width:90%;max-width:650px;text-align:center;padding:45px;background:rgba(255,255,255,.18);backdrop-filter:blur(20px);border-radius:30px;box-shadow:0 20px 60px #0006}.icon{font-size:90px;animation:spin 5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:45px}p{font-size:18px;line-height:1.6}.badge{display:inline-block;margin-top:25px;padding:15px 30px;border-radius:50px;background:#ff416c}.loader{width:70px;height:70px;margin:30px auto;border:8px solid #ffffff55;border-top-color:white;border-radius:50%;animation:spin 1s linear infinite}footer{margin-top:20px}
</style></head><body><div class="box"><div class="icon">⚙️</div><h1>We'll Be Back Soon</h1><p>Our website is currently under maintenance.<br>We are making improvements and will return shortly.</p><div class="badge">🚧 Website Temporarily Offline</div><div class="loader"></div><footer>Thank you for your patience ❤️<br><br>© <span id="year"></span> Your Organization</footer></div><script>document.getElementById('year').textContent=new Date().getFullYear();</script></body></html>
